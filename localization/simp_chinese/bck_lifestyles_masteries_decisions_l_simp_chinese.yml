 # Decision Titles and Descriptions
 pursue_mastery_decision:0 "追求精通"
 pursue_mastery_decision_desc:0 "经过数十年的奉献、磨炼与不懈自律，你已达到了技艺的巅峰。步入成熟之年，真正的大师必须认清自己的终极使命。然而，人生只能在一门领域真正登峰造极——明智地选择你的道路。"
 pursue_mastery_decision_tooltip:0 "宣告毕生的奉献，并获得一项大师特质。"
 pursue_mastery_age_requirement:0 "你至少40岁"
 pursue_mastery_decision_confirm:0 "我将成就精通"

 # Decision Interface
 PURSUE_MASTERY_CHOOSE_FOCUS_BUTTON:0 "选择精通领域"
 master_learning_option:0 "追求学术精通"
 master_learning_option_tooltip:0 "你将投身于永无止境的求知之路，力求获得真正的启迪，并在旅途中获得#HIGH 学术大师#!特质。"
 master_learning_option_not_has_perks:0 "你在学识生活方式中没有至少#HIGH 20#!个特质点"
 master_intrigue_option:0 "追求谋略精通"
 master_intrigue_option_tooltip:0 "你将精通潜行暗处的微妙技艺，以欺瞒、秘密和暗中结交的人脉为武器，并获得#HIGH 谋略大师#!特质。"
 master_intrigue_option_not_has_perks:0 "你在谋略生活方式中没有至少#HIGH 20#!个特质点"
 master_diplomacy_option:0 "追求外交精通"
 master_diplomacy_option_tooltip:0 "你将学习宫廷礼仪、治国之道、说服和领导能力，这些本领将使你获得#HIGH 外交大师#!特质。"
 master_diplomacy_option_not_has_perks:0 "你在外交生活方式中没有至少#HIGH 20#!个特质点"
 master_martial_option:0 "追求军事精通"
 master_martial_option_tooltip:0 "你将征服战略与谋略的领域，同时驾驭战场上的狂怒与混乱，从而成为#HIGH 军事大师#!。"
 master_martial_option_not_has_perks:0 "你在军事生活方式中没有至少#HIGH 20#!个特质点"
 master_stewardship_option:0 "追求管理精通"
 master_stewardship_option_tooltip:0 "你将把管理领地视作自己的技艺，确保金钱与贸易流通、领地繁荣昌盛，从而获得#HIGH 管理大师#!特质。"
 master_stewardship_option_not_has_perks:0 "你在管理生活方式中没有至少#HIGH 20#!个特质点"
 master_wandering_option:0 "追求漫游精通"
 master_wandering_option_tooltip:0 "你将前往遥远的土地，见识异国文化与风土人情，提升军事才能并增长对世界的了解，从而获得#HIGH 漫游大师#!特质。"
 master_wandering_option_not_has_perks:0 "你在漫游生活方式中没有至少#HIGH 20#!个特质点"
