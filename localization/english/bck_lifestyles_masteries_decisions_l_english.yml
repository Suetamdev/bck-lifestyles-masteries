 # Decision Titles and Descriptions
 pursue_mastery_decision:0 "Pursuing Mastery"
 pursue_mastery_decision_desc:0 "Through decades of dedication, trial, and relentless discipline, you have reached the absolute peak of your craft. Having reached mature age, a true master must recognize their ultimate calling. However, life allows for only one true mastery—choose your path wisely."
 pursue_mastery_decision_tooltip:0 "Declare your lifelong dedication and claim a Master Trait."
 pursue_mastery_age_requirement:0 "You are at least 40 years old"
 pursue_mastery_decision_confirm:0 "I will claim my mastery"

 # Decision Interface
 PURSUE_MASTERY_CHOOSE_FOCUS_BUTTON:0 "Choose Mastery Focus"
 master_learning_option:0 "Pursue Mastery of Learning"
 master_learning_option_tooltip:0 "You will dedicate yourself to the eternal pursuit of knowledge, striving to achieve true enlightenment, and in doing so, your journey will grant you the [GetTrait('master_learning').GetName( GetNullCharacter )] trait."
 master_learning_option_not_has_perks:0 "You do not have at least #HIGH 20#! Perks in the Learning Lifestyle"
 master_intrigue_option:0 "Pursue Mastery of Intrigue"
 master_intrigue_option_tooltip:0 "You will master the subtle arts of acting in the shadows—with deception, secrecy, and shadow networks as your weapons—granting you the [GetTrait('master_intrigue').GetName( GetNullCharacter )] trait."
 master_intrigue_option_not_has_perks:0 "You do not have at least #HIGH 20#! Perks in the Intrigue Lifestyle"
 master_diplomacy_option:0 "Pursue Mastery of Diplomacy"
 master_diplomacy_option_tooltip:0 "You will educate yourself in courtly etiquette, statecraft, persuasion, and leadership—abilities that will grant you the [GetTrait('master_diplomacy').GetName( GetNullCharacter )] trait."
 master_diplomacy_option_not_has_perks:0 "You do not have at least #HIGH 20#! Perks in the Diplomacy Lifestyle"
 master_martial_option:0 "Pursue Mastery of Warfare"
 master_martial_option_tooltip:0 "You will conquer the realms of strategy and mind while wielding the fury and chaos of the battlefield, making you the [GetTrait('master_martial').GetName( GetNullCharacter )] trait."
 master_martial_option_not_has_perks:0 "You do not have at least #HIGH 20#! Perks in the Martial Lifestyle"
 master_stewardship_option:0 "Pursue Mastery of Stewardship"
 master_stewardship_option_tooltip:0 "You will make domain management your craft, ensuring that gold and trade flow and your domain prospers, granting you the [GetTrait('master_stewardship').GetName( GetNullCharacter )] trait."
 master_stewardship_option_not_has_perks:0 "You do not have at least #HIGH 20#! Perks in the Stewardship Lifestyle"
 master_wandering_option:0 "Pursue Mastery of Wandering"
 master_wandering_option_tooltip:0 "You will travel to distant lands to witness foreign cultures and places, improving your martial prowess and knowledge of the world, granting you the [GetTrait('master_wandering').GetName( GetNullCharacter )] trait."
 master_wandering_option_not_has_perks:0 "You do not have at least #HIGH 20#! Perks in the Wandering Lifestyle"