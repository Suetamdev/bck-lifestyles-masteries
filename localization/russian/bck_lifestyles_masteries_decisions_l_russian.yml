l_russian:
 # Decision Titles and Descriptions
 pursue_mastery_decision:0 "Стремление к мастерству"
 pursue_mastery_decision_desc:0 "После десятилетий преданности делу, испытаний и неустанной дисциплины вы достигли вершины своего ремесла. В зрелом возрасте истинный мастер должен осознать свое главное призвание. Однако жизнь позволяет достичь истинного мастерства лишь в одной области — выбирайте свой путь с умом."
 pursue_mastery_decision_tooltip:0 "Заявите о преданности делу всей жизни и получите черту мастера."
 pursue_mastery_age_requirement:0 "Вам не менее 40 лет"
 pursue_mastery_decision_confirm:0 "Я достигну мастерства"

 # Decision Interface
 PURSUE_MASTERY_CHOOSE_FOCUS_BUTTON:0 "Выбрать область мастерства"
 master_learning_option:0 "Стать мастером учености"
 master_learning_option_tooltip:0 "Вы посвятите себя вечному поиску знаний, стремясь обрести истинное просветление. Этот путь дарует вам черту [GetTrait('master_learning').GetName( GetNullCharacter )]."
 master_learning_option_not_has_perks:0 "У вас нет как минимум #HIGH 20#! перков образа жизни «Ученость»"
 master_intrigue_option:0 "Стать мастером интриг"
 master_intrigue_option_tooltip:0 "Вы овладеете тонким искусством действовать из тени, используя обман, тайны и сети влияния, и получите черту [GetTrait('master_intrigue').GetName( GetNullCharacter )]."
 master_intrigue_option_not_has_perks:0 "У вас нет как минимум #HIGH 20#! перков образа жизни «Интриги»"
 master_diplomacy_option:0 "Стать мастером дипломатии"
 master_diplomacy_option_tooltip:0 "Вы освоите придворный этикет, искусство управления, убеждение и лидерство — эти умения даруют вам черту [GetTrait('master_diplomacy').GetName( GetNullCharacter )]."
 master_diplomacy_option_not_has_perks:0 "У вас нет как минимум #HIGH 20#! перков образа жизни «Дипломатия»"
 master_martial_option:0 "Стать мастером военного дела"
 master_martial_option_tooltip:0 "Вы покорите области стратегии и разума, овладев яростью и хаосом поля боя, и получите черту [GetTrait('master_martial').GetName( GetNullCharacter )]."
 master_martial_option_not_has_perks:0 "У вас нет как минимум #HIGH 20#! перков образа жизни «Военное дело»"
 master_stewardship_option:0 "Стать мастером управления"
 master_stewardship_option_tooltip:0 "Вы превратите управление владениями в свое ремесло, обеспечивая поток золота и торговли и процветание своих земель. Вы получите черту [GetTrait('master_stewardship').GetName( GetNullCharacter )]."
 master_stewardship_option_not_has_perks:0 "У вас нет как минимум #HIGH 20#! перков образа жизни «Управление»"
 master_wandering_option:0 "Стать мастером странствий"
 master_wandering_option_tooltip:0 "Вы отправитесь в дальние земли, чтобы познакомиться с чужими культурами и местами, улучшить военное мастерство и расширить познания о мире, получив черту [GetTrait('master_wandering').GetName( GetNullCharacter )]."
 master_wandering_option_not_has_perks:0 "У вас нет как минимум #HIGH 20#! перков образа жизни «Странствия»"
